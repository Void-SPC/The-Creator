name: Тесты и сборка мастерской

# Только проверка и сборка. Публикации здесь нет: плейс Office (74144820847995)
# обновляется вручную workflow «Workshop» в репозитории Office-game
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Тесты ядра и проверка строк интерфейса
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.700/luau-ubuntu.zip
          unzip -o luau.zip -d luau-bin
          tools/run_tests.sh luau-bin/luau

      - name: Сборка Workshop.rbxlx
        run: |
          python3 tools/build_place.py --out out/Workshop.rbxlx
          cmp out/Workshop.rbxlx dist/Workshop.rbxlx && echo "Файл в dist/ совпадает со сборкой" || echo "::warning::dist/Workshop.rbxlx устарел, пересоберите"

      - name: Проверка сборки через Rojo
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o rojo.zip -d rojo-bin
          chmod +x rojo-bin/rojo
          rojo-bin/rojo build default.project.json -o out/Workshop-rojo.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: Workshop-place
          path: |
            out/Workshop.rbxlx
            out/Workshop.manifest.json
